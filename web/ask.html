<!doctype html>
<html lang="en" data-theme="morning" data-masthead="blackletter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6d3bd">
<title>Ask | The Times</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141010'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f6d3bd'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/manufacturing-consent.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script type="module" src="/ask.js"></script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<header class="set-mast"><p class="nameplate"><a href="/">The Times</a></p></header>
<div class="set-page ask-page sheet">
  <nav class="crumb"><a href="/">Back to the paper</a></nav>
  <h1 class="page-head" tabindex="-1">Ask the paper</h1>
  <p class="deck">It has read today's edition and everything you've connected. It can answer, and it can't do anything else.</p>
  <form class="ask-form" id="ask-form">
    <label for="question">Your question</label>
    <textarea id="question" name="question" maxlength="1000" required></textarea>
    <div><button type="submit" class="btn" id="ask-go">Ask</button></div>
  </form>
  <div class="ask-try" id="ask-try">
    <button type="button" class="ghost text">What needs me today?</button>
    <button type="button" class="ghost text">What changed in the world overnight?</button>
    <button type="button" class="ghost text">Am I making money?</button>
    <button type="button" class="ghost text">Is anything broken?</button>
  </div>
  <div class="ask-log" id="ask-log" aria-live="polite"></div>
</div>
</body>
</html>
